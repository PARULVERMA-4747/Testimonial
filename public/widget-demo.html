<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widget Demo</title>
    <style>
      body {
        font-family: Inter, system-ui, sans-serif;
        margin: 0;
        color: #111827;
        background: linear-gradient(135deg, #f8fafc, #eef2ff);
      }
      .demo-shell {
        max-width: 900px;
        margin: 4rem auto;
        padding: 2rem;
        background: white;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
      }
      iframe {
        border: 0;
        width: 100%;
        min-height: 420px;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <main class="demo-shell">
      <h1>Embedded testimonial widget</h1>
      <p>The widget below can live on any site that embeds this snippet.</p>
      <iframe src="/widget?accent=%230f766e&layout=grid" title="Testimonial widget"></iframe>
    </main>
  </body>
</html>
